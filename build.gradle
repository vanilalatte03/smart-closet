plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.smartcloset'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def springBootVersion = '4.0.6'
def springAiVersion = '2.0.0'

dependencies {
    implementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    testImplementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    testImplementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.netty') {
            details.useVersion '4.2.17.Final'
            details.because 'CI security gate requires Netty versions with current high/critical CVE fixes'
        }
        if (details.requested.group == 'org.apache.tomcat.embed') {
            details.useVersion '11.0.25'
            details.because 'CI security gate requires Tomcat versions with current high/critical CVE fixes'
        }
        if (details.requested.group == 'org.springframework') {
            details.useVersion '7.0.9'
            details.because 'CI image scan requires patched Spring Framework modules'
        }
        if (details.requested.group == 'org.springframework.data'
                && details.requested.name == 'spring-data-commons') {
            details.useVersion '4.0.6'
            details.because 'CI image scan requires patched Spring Data Commons'
        }
        if (details.requested.group == 'io.micrometer'
                && details.requested.name in ['micrometer-core', 'micrometer-commons',
                                            'micrometer-observation', 'micrometer-registry-prometheus']) {
            details.useVersion '1.16.6'
            details.because 'Keep Micrometer metrics modules aligned with the security patch'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core'
                && details.requested.name in ['jackson-core', 'jackson-databind']) {
            details.useVersion '2.21.7'
            details.because 'CI image scan requires patched Jackson 2 JSON processing'
        }
        if (details.requested.group == 'tools.jackson.core') {
            details.useVersion '3.1.7'
            details.because 'CI image scan requires patched Jackson 3 JSON processing'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('recommendationBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in recommendation scoring comparison without DB or external providers.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    if (providers.gradleProperty('benchmarkMainClasses').isPresent()) {
        classpath = classpath.minus(files(sourceSets.main.output.classesDirs))
                .plus(files(providers.gradleProperty('benchmarkMainClasses').get()))
    }
    mainClass = 'com.smartcloset.recommendation.domain.RecommendationScoringBenchmark'
    jvmArgs '-Xms512m', '-Xmx512m'
    args providers.gradleProperty('benchmarkMode').getOrElse('prepared')
}

checkstyle {
    configDirectory = file("${rootDir}/config/checkstyle")
    maxWarnings = 0
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
